[project]
name = "margo-backend"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic[email]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "httpx>=0.28,<1", "apscheduler>=3.11,<4", "tzdata>=2025.1",
  "google-auth[requests]>=2.40,<3"
]
[dependency-groups]
dev = ["pytest>=8,<10"]
gmail-setup = ["google-auth-oauthlib>=1.2,<2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*", "classification*", "recommendation*", "ingestion*", "workers*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
