services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: thoth
      POSTGRES_USER: thoth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thoth"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    volumes:
      - ./backend/releases:/app/releases:ro
    environment:
      DATABASE_URL: postgresql+psycopg://thoth:${POSTGRES_PASSWORD}@db:5432/thoth
      MARGO_GMAIL_CLIENT_ID: ${MARGO_GMAIL_CLIENT_ID:-}
      MARGO_GMAIL_CLIENT_SECRET: ${MARGO_GMAIL_CLIENT_SECRET:-}
      MARGO_GMAIL_REFRESH_TOKEN: ${MARGO_GMAIL_REFRESH_TOKEN:-}
      MARGO_MAIL_FROM: ${MARGO_MAIL_FROM:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    build: ./backend
    command: ["python", "-m", "workers.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://thoth:${POSTGRES_PASSWORD}@db:5432/thoth
      WIKIMEDIA_USER_AGENT: ${WIKIMEDIA_USER_AGENT:-}
      MARGO_CATALOG_AUTO_REFILL: ${MARGO_CATALOG_AUTO_REFILL:-true}
      MARGO_CATALOG_LOW_WATERMARK: ${MARGO_CATALOG_LOW_WATERMARK:-60}
      MARGO_CATALOG_BATCH: ${MARGO_CATALOG_BATCH:-20}
      MARGO_CATALOG_BUDGET: ${MARGO_CATALOG_BUDGET:-100}
    depends_on:
      api:
        condition: service_started
    restart: on-failure
volumes:
  postgres_data:
